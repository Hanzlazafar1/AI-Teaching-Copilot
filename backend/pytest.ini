[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast, no external dependencies (mocked LLM, no network)
    integration: real Qdrant, mocked LLM, no HTTP server
    acceptance: live HTTP API calls, real OpenAI (costs money)
    evaluation: end-to-end Brady sample replay (expensive)
    slow: marks tests as slow (skipped by default with -m 'not slow')
